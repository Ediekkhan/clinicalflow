services:
  - type: web
    name: synaptiverse-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENVIRONMENT
        value: staging
      - key: CHANNEL_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: DEFAULT_TENANT_ID
        value: 11111111-1111-1111-1111-111111111111
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.4
